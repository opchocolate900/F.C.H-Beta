<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سایت خاموش است</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #14161c;
    color: #f2f2f2;
    font-family: Tahoma, "Segoe UI", sans-serif;
    text-align: center;
    padding: 20px;
    box-sizing: border-box;
  }
  .line {
    font-size: 1.6rem;
    line-height: 2.4rem;
    min-height: 2.4rem;
  }
  #cursor {
    display: inline-block;
    width: 2px;
    height: 1.6rem;
    background: #f2f2f2;
    margin-right: 4px;
    vertical-align: middle;
    animation: blink 0.8s infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  button {
    margin-top: 32px;
    padding: 12px 34px;
    font-size: 1.1rem;
    font-family: inherit;
    color: #fff;
    background: #e63946;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.8s, transform 0.2s;
  }
  button.show { opacity: 1; pointer-events: auto; }
  button:hover { transform: scale(1.05); }
  button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) {
    #cursor { animation: none; }
    button { transition: none; }
  }
</style>
</head>
<body>
  <div class="line"><span id="text"></span><span id="cursor"></span></div>
  <button id="retry">تلاش مجدد</button>

<script>
  const message = "سایت فعلاً خاموش است، لطفاً بعداً تلاش کنید";
  const textEl = document.getElementById("text");
  const btn = document.getElementById("retry");
  let timer = null;

  function typeText() {
    clearInterval(timer);
    textEl.textContent = "";
    btn.classList.remove("show");
    let i = 0;
    timer = setInterval(() => {
      textEl.textContent += message[i];
      i++;
      if (i >= message.length) {
        clearInterval(timer);
        btn.classList.add("show");
      }
    }, 80);
  }

  btn.addEventListener("click", typeText);
  typeText();
</script>
</body>
</html>
