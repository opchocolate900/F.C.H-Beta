<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>خوش آمدید</title>
<style>
  :root {
    --bg: #07080d;
    --glow: #38e8ff;
    --glow2: #7a5cff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: #fff;
    font-family: Tahoma, "Segoe UI", sans-serif;
    overflow: hidden;
    text-align: center;
    padding: 20px;
  }

  /* نور پس‌زمینه */
  body::before {
    content: "";
    position: fixed;
    width: 60vmax;
    height: 60vmax;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(122,92,255,0.28) 0%, rgba(56,232,255,0.10) 35%, transparent 65%);
    animation: breathe 4s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes breathe {
    0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(0.95); }
    50%      { opacity: 1;   transform: translate(-50%, -50%) scale(1.08); }
  }

  /* متن درخشان */
  #welcome {
    position: relative;
    margin: 0;
    font-size: clamp(2.6rem, 11vw, 6rem);
    font-weight: bold;
    color: #fff;
    opacity: 0;
    filter: blur(18px);
    transform: scale(0.85);
    animation:
      reveal 1.6s ease-out 0.4s forwards,
      glow 2.4s ease-in-out 2s infinite;
  }
  @keyframes reveal {
    to { opacity: 1; filter: blur(0); transform: scale(1); }
  }
  @keyframes glow {
    0%, 100% {
      text-shadow: 0 0 8px var(--glow), 0 0 22px var(--glow), 0 0 46px var(--glow2);
    }
    50% {
      text-shadow: 0 0 14px var(--glow), 0 0 40px var(--glow), 0 0 90px var(--glow2), 0 0 140px var(--glow2);
    }
  }

  /* نوار لودینگ */
  .bar {
    position: relative;
    width: min(280px, 70vw);
    height: 4px;
    margin-top: 48px;
    background: rgba(255,255,255,0.12);
    border-radius: 4px;
    overflow: hidden;
    opacity: 0;
    animation: fadein 0.8s ease 1.2s forwards;
  }
  .bar span {
    position: absolute;
    inset: 0 0 0 auto;      /* از راست شروع می‌شود */
    width: 0%;
    background: linear-gradient(270deg, var(--glow), var(--glow2));
    box-shadow: 0 0 12px var(--glow);
    border-radius: 4px;
  }
  .percent {
    margin-top: 14px;
    font-size: 0.95rem;
    color: rgba(255,255,255,0.6);
    opacity: 0;
    animation: fadein 0.8s ease 1.2s forwards;
  }
  @keyframes fadein { to { opacity: 1; } }

  /* محو شدن آخر کار */
  #fade {
    position: fixed;
    inset: 0;
    background: #000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.9s ease;
  }
  #fade.on { opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    body::before { animation: none; }
    #welcome { animation: reveal 0.1s forwards; filter: none; }
  }
</style>
</head>
<body>
  <h1 id="welcome">خوش آمدید</h1>
  <div class="bar"><span id="fill"></span></div>
  <div class="percent" id="percent">0%</div>
  <div id="fade"></div>

<script>
  // ← اسم فایل سایت اصلی‌ات
  const TARGET = "main-site.html";
  // ← مدت لودینگ به میلی‌ثانیه (۴۰۰۰ = ۴ ثانیه)
  const DURATION = 4000;

  const fill = document.getElementById("fill");
  const percent = document.getElementById("percent");
  const fade = document.getElementById("fade");
  const start = performance.now();

  // اعداد فارسی برای درصد
  const fa = n => String(n).replace(/\d/g, d => "۰۱۲۳۴۵۶۷۸۹"[d]);

  function tick(now) {
    const p = Math.min((now - start) / DURATION, 1);
    const eased = 1 - Math.pow(1 - p, 2);
    const val = Math.round(eased * 100);
    fill.style.width = val + "%";
    percent.textContent = fa(val) + "٪";
    if (p < 1) {
      requestAnimationFrame(tick);
    } else {
      fade.classList.add("on");
      setTimeout(() => { window.location.href = TARGET; }, 900);
    }
  }
  requestAnimationFrame(tick);
</script>
</body>
</html>
